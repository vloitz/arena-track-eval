name: Recolector Horario Elite

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # --- NUEVO PASO CRÍTICO (Para cálculo dinámico de tiempo) ---
      - name: ⏱️ Marcar Inicio del Reloj
        run: echo "JOB_START_TIME=$(date +%s%3N)" >> $GITHUB_ENV
      # -----------------------------------------------------------

      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20 con Caché
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🚀 Instalar Dependencias (Modo CI)
        run: npm ci

      - name: 🤖 Ejecutar Recolector Humano Elite
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node index.js
