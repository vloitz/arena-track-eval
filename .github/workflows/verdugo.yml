name: El Verdugo (Monitor de Calidad)

on:
  schedule:
    # Se ejecuta 4 veces al día (cada 6 horas) para procesar el atasco logístico masivo
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch: # Esto habilita un botón para ejecutarlo manualmente cuando quieras

jobs:
  limpieza:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # --- NUEVO PASO CRÍTICO (Para cálculo dinámico de tiempo) ---
      - name: ⏱️ Marcar Inicio del Reloj (Precisión Milimétrica)
        run: echo "JOB_START_TIME=$(date +%s%3N)" >> $GITHUB_ENV
      # -----------------------------------------------------------

      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar El Verdugo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node monitor.js
